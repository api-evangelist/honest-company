aid: honest-company
name: Honest Company
description: >-
  The Honest Company is a consumer-products brand founded in 2011 and
  headquartered in Los Angeles, offering baby care, personal care, beauty, and
  household cleaning products built around its "Honest Standard" of ingredient
  transparency. Its direct-to-consumer storefront at honest.com runs on Shopify
  and exposes a modern agent-native commerce surface: a published /agents.md and
  /llms.txt, an /.well-known/ucp Universal Commerce Protocol merchant profile, a
  live UCP shopping MCP endpoint for agent-driven catalog search, cart, and
  buyer-approved checkout, and Shopify Customer Account API OAuth2/OIDC
  discovery documents. This profile was surfaced as a General Catalyst portfolio
  company and enriched by the API Evangelist pipeline from the store's public
  agent and discovery surfaces.
